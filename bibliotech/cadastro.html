<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>
  <div>
    <h1>Cadastro</h1>
    <form id="formCadastro">
      <label for="nome">Nome completo</label><br>
      <input type="text" id="nome" required><br>

      <label for="email">E-mail</label><br>
      <input type="email" id="email" required><br>

      <label for="usuario">Usuário</label><br>
      <input type="text" id="usuario" required><br>

      <label for="senha">Senha</label><br>
      <input type="password" id="senha" required><br>

      <label for="confirmarSenha">Confirmar senha</label><br>
      <input type="password" id="confirmarSenha" required><br>

      <input type="submit" id="button2" value="Cadastrar">
    </form>
  </div>

  <script>
    const form = document.getElementById("formCadastro");
    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const usuario = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value;
      const confirmarSenha = document.getElementById("confirmarSenha").value;

      if (!nome || !email || !usuario || !senha || !confirmarSenha) {
        alert("Por favor, preencha todos os campos.");
        return;
      }

      if (senha !== confirmarSenha) {
        alert("As senhas não coincidem!");
        return;
      }

      alert("Cadastro realizado com sucesso!");
      form.reset();
    });
  </script>
</body>
</html>
