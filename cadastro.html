<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotech - Cadastro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #291930;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #554971;
            padding: 10px;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            text-align: center;
        }
        nav ul li {
            display: inline;
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        nav ul li a:hover {
            text-decoration: underline;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .container h1 {
            color: #291930;
            margin-bottom: 20px;
        }
        .container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .container button {
            width: 100%;
            padding: 10px;
            background-color: #554971;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .container button:hover {
            background-color: #6a5a90;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .link {
            margin-top: 10px;
        }
        .link a {
            color: #554971;
            text-decoration: none;
        }
        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bibliotech</h1>
        <p>Biblioteca online</p>
    </header>
    <nav>
        <ul>
            <li><a href="login.html">Login</a></li>
            <li><a href="cadastro.html">Cadastro</a></li>
            <li><a href="home.html">Início</a></li>
            <li><a href="livros.html">Livros</a></li>
            <li><a href="autores.html">Autores</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1>Cadastro</h1>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Usuário" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Senha" required>
            <input type="password" id="confirmPassword" placeholder="Confirmar Senha" required>
            <button type="submit">Cadastrar</button>
        </form>
        <div id="errorMessage" class="error"></div>
        <div class="link">
            <p>Já possui conta? <a href="login.html">Faça login</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                document.getElementById('errorMessage').textContent = 'As senhas não coincidem.';
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    alert('Cadastro realizado com sucesso!');
                    window.location.href = 'login.html';
                } else {
                    document.getElementById('errorMessage').textContent = 'Erro ao cadastrar. Tente novamente.';
                }
            } catch (error) {
                console.error('Erro ao cadastrar:', error);
                document.getElementById('errorMessage').textContent = 'Erro de conexão. Tente novamente.';
            }
        });
    </script>
</body>
</html>
